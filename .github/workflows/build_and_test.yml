name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  LOCAL_IMAGE: gpu-cluster-training-test:ci

jobs:
  build-test:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker availability
        run: docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: docker build -t "${LOCAL_IMAGE}" .

      - name: Run smoke test
        run: |
          docker run --rm \
            -e CUDA_VISIBLE_DEVICES="" \
            -e HF_DATASETS_CACHE=/tmp/hf-cache \
            --entrypoint python \
            "${LOCAL_IMAGE}" \
            test_smoke.py
